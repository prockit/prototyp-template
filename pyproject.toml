[project]
name = "prototype"
version = "0.1.0"
description = "Python prototype built to validate an idea before IT implements it in the productive stack."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.22",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.5",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["app"]
addopts = "-q --import-mode=importlib"
